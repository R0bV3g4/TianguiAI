services:
  postgres:
    image: postgres:16-alpine
    container_name: tianguia-postgres
    environment:
      POSTGRES_DB: tianguia
      POSTGRES_USER: tianguia
      POSTGRES_PASSWORD: tianguia_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tianguia"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: tianguia-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: tianguia-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    # Descomenta para GPU pass-through:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  api:
    build: ./api
    container_name: tianguia-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://tianguia:tianguia_dev_only@postgres:5432/tianguia
      QDRANT_URL: http://qdrant:6333
      # ── LLM provider switch ───────────────────────────────────────
      # ollama | openrouter | openai | anthropic
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # Ollama (local)
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral-nemo}
      # OpenRouter (multi-model proxy)
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      # OpenAI (direct API)
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      # Anthropic (direct API)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      # ── Flags por reto ────────────────────────────────────────────
      AGENT_FLAG_PROMPT_LEAK: ${AGENT_FLAG_PROMPT_LEAK}
      AGENT_FLAG_IDOR: ${AGENT_FLAG_IDOR}
      AGENT_FLAG_REFUND: ${AGENT_FLAG_REFUND}
      AGENT_FLAG_INDIRECT: ${AGENT_FLAG_INDIRECT}
      AGENT_FLAG_RAG_POISON: ${AGENT_FLAG_RAG_POISON}
      AGENT_FLAG_COUPON: ${AGENT_FLAG_COUPON}
      AGENT_FLAG_CREDIT: ${AGENT_FLAG_CREDIT}
      AGENT_FLAG_EMAIL_EXFIL: ${AGENT_FLAG_EMAIL_EXFIL}
      AGENT_FLAG_TOOL_CONFUSION: ${AGENT_FLAG_TOOL_CONFUSION}
      AGENT_FLAG_DOS: ${AGENT_FLAG_DOS}
      AGENT_FLAG_PRICE_MANIPULATION: ${AGENT_FLAG_PRICE_MANIPULATION:-FLAG{price_manipulation_REPLACE_ME}}
    ports:
      - "8000:8000"

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
